name: Publish Foundry module
on:
  push:
    branches: [main]
    paths:
      - module.json
      - languages/**
      - scripts/core/GameRegistry.js
      - scripts/core/GameGuideRu.js
      - tests/game-guide-ru.test.mjs
      - .github/workflows/release.yml
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: parlor-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run module tests
        run: node --test tests/*.test.mjs
      - name: Validate manifest and build installable ZIP
        run: |
          python3 - <<'PY'
          import json, pathlib, zipfile, os
          root = pathlib.Path('.')
          m = json.loads((root/'module.json').read_text(encoding='utf-8'))
          tag = 'v'+m['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == tag
          name = 'lipatos-parlor-'+tag+'.zip'
          assert m['id'] == 'parlor'
          assert m['manifest'] == 'https://github.com/Lipatosha/LipatoS-Parlor/releases/latest/download/module.json'
          assert m['download'] == f'https://github.com/Lipatosha/LipatoS-Parlor/releases/download/{tag}/{name}'
          for p in m.get('esmodules', [])+m.get('styles', [])+[x['path'] for x in m.get('languages', [])]:
              assert (root/p).is_file(), p
          assert any(x.get('lang') == 'ru' and x.get('path') == 'languages/ru.json' for x in m.get('languages', []))
          assert (root/'scripts/core/GameGuideRu.js').is_file()
          for p in root.rglob('*.json'):
              if not any(x.startswith('.') for x in p.parts):
                  json.loads(p.read_text(encoding='utf-8'))
          files = [p for p in sorted(root.rglob('*')) if p.is_file() and not any(x.startswith('.') for x in p.parts) and p.suffix != '.zip']
          with zipfile.ZipFile(name+'.tmp', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  z.write(p, 'parlor/'+p.as_posix())
          pathlib.Path(name+'.tmp').replace(name)
          with zipfile.ZipFile(name) as z:
              assert z.testzip() is None
              assert json.loads(z.read('parlor/module.json')) == m
              assert 'parlor/scripts/core/GameGuideRu.js' in z.namelist()
              print(f'Validated {len(z.namelist())} package files')
          PY
      - name: Publish versioned release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('module.json')).version")
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "LipatoS — Parlor $TAG" --notes "Полный ручной русский перевод интерфейса и правил 12 игр, включая правила добора в баккаре. Сохранены английский и китайский языки. Манифест: https://github.com/Lipatosha/LipatoS-Parlor/releases/latest/download/module.json . Автоматические тесты пройдены; проверка в запущенном Foundry VTT остаётся необходимой." --latest
          fi
          gh release upload "$TAG" module.json "lipatos-parlor-$TAG.zip" --clobber
